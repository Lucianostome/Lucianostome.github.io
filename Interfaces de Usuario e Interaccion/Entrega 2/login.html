<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoneArcade - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
</head>
<body class="page-container">

  <div class="blurred-background"></div>

  <div id="header-container"></div>

  <main class="main-content login-wrapper">
    <section class="login-card" id="loginCard">
      <h1 class="login-title">Iniciar Sesión</h1>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="tuemail@ejemplo.com">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary hover-glow">Ingresar</button>
      </form>

      <div class="social-login">
        <button type="button" class="btn btn-social btn-google hover-scale">
          <img src="assets/icons/icono-google.svg" alt="Google" class="social-icon-btn">
          <span>Continuar con Google</span>
        </button>

        <button type="button" class="btn btn-social btn-facebook hover-scale">
          <img src="assets/icons/icono-facebook.svg" alt="Facebook" class="social-icon-btn">
          <span>Continuar con Facebook</span>
        </button>
      </div>

      <p class="register-text">
        No tienes cuenta? <a href="registro.html" class="register-link">Registrate</a>
      </p>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="js/insertar-header-footer.js"></script>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
