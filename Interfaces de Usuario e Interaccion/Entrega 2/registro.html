<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoneArcade - Registrarse</title>

  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/user-menu.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/registro.css">
</head>
<body class="page-container">

  <div class="blurred-background"></div>

  <div id="header-container"></div>

  <main class="main-content register-wrapper">
    <section class="register-card" id="registerCard">
      <h1 class="register-title">Registrarse</h1>

      <form class="register-form" id="registerForm" novalidate>
        <div class="form-group">
          <label for="fullName">Nombre y Apellido</label>
          <input type="text" id="fullName" required placeholder="Tu nombre completo">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="tuemail@ejemplo.com">
        </div>

        <div class="form-group form-group-short">
          <label for="age">Edad</label>
          <div class="select-wrapper">
            <select id="age" required>
              <option value="" disabled selected></option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
              <option value="21">21</option>
              <option value="22">22</option>
              <option value="23">23</option>
              <option value="24">24</option>
              <option value="25+">25+</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required maxlength="8" placeholder="••••••••">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" required placeholder="••••••••">
        </div>

        <div class="recaptcha-box">
          <label class="recaptcha-checkbox-label">
            <input type="checkbox" id="recaptchaCheck" required>
            <span class="custom-checkbox"></span>
            <span class="recaptcha-text">No soy un robot</span>
          </label>
          <div class="recaptcha-logo">
            <img src="assets/icons/recaptcha.svg" alt="reCAPTCHA">
            <span>reCAPTCHA</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary hover-glow">Registrarse</button>
      </form>

      <div class="social-login">
        <button type="button" class="btn btn-social btn-google hover-scale">
          <img src="assets/icons/icono-google.svg" alt="Google" class="social-icon-btn">
          <span>Registrarse con Google</span>
        </button>

        <button type="button" class="btn btn-social btn-facebook hover-scale">
          <img src="assets/icons/icono-facebook.svg" alt="Facebook" class="social-icon-btn">
          <span>Registrarse con Facebook</span>
        </button>
      </div>

      <p class="login-redirect-text">
        Ya tienes cuenta? <a href="login.html" class="login-redirect-link">Iniciar Sesión</a>
      </p>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="js/insertar-header-footer.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
